<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>choose your pet</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/pawker/tokens.css">
<link rel="stylesheet" href="ds/pawker/components/bundle.css">
<script src="ds/pawker/components/bundle.js"></script>
<link rel="stylesheet" href="night.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700&amp;family=Merriweather+Sans:wght@700&amp;family=Inter:wght@400;700&amp;family=Barlow:wght@400&amp;display=swap">
<style>
body{margin:0;background:#1C4F31}
a{color:#F5CF6E}a:hover{color:#FFF6DF}
.ss-row:hover{border-color:var(--border)}
.ss-tile:hover{border-color:var(--border)}
</style>
</helmet>
<div data-theme="christmas" data-panel="{{panel}}" style="isolation: isolate; --font-display: 'Be Vietnam Pro', 'Merriweather Sans', sans-serif; width: 100%; min-height: 844px; position: relative; box-sizing: border-box; background: var(--page); font-family: var(--font-sans); color: var(--ink); display: flex; flex-direction: column; align-items: center">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: -1; overflow: hidden; pointer-events: none"><dc-import name="SceneSky" hint-size="100%,100%"></dc-import></div>
<div style="box-sizing: border-box; width: 100%; max-width: 440px; padding: 22px 22px 16px; display: flex; flex-direction: column; gap: 22px; flex-grow: 1">
<div style="display: flex; flex-direction: column; gap: 8px"><div style="display: flex; align-items: center; gap: 11px"><span style="box-sizing: border-box; width: 24px; height: 32px; display: flex; align-items: center; justify-content: center; background: var(--panel-inner); border: 2px solid var(--action); border-radius: 6px; box-shadow: var(--shadow-mark)"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12" shape-rendering="crispEdges"><rect x="1" y="5" width="10" height="6" fill="var(--action)"></rect><rect x="0" y="3" width="12" height="2" fill="var(--action)"></rect><rect x="5" y="3" width="2" height="8" fill="#D6455A"></rect><rect x="3" y="1" width="2" height="2" fill="#D6455A"></rect><rect x="7" y="1" width="2" height="2" fill="#D6455A"></rect></svg></span><span class="wordmark" style="color: var(--ink)">secret santa</span></div><div style="display: flex; flex-direction: column; gap: 2px; padding-left: 35px"><span class="title" style="color: var(--ink)">christmas 2026</span><span class="note-lg" style="color: var(--ink-2)">budget 300k · gift day 24 dec</span></div></div>
<a href="{{backHref}}" class="label" style="display: inline-flex; align-items: center; gap: 4px; min-height: 44px; width: fit-content; text-decoration: none; color: var(--ink-2)"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12" shape-rendering="crispEdges" fill="currentColor"><path d="M6 2h2v1h-2zM5 3h2v1h-2zM4 4h2v1h-2zM3 5h2v1h-2zM3 6h2v1h-2zM4 7h2v1h-2zM5 8h2v1h-2zM6 9h2v1h-2z"></path></svg><span>back</span></a>
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 class="headline" style="margin: 0">choose your pet</h1>
<span class="body-sm" style="color: var(--ink-2)">your santa only ever sees your pet and pet name, never your real name. remember which one you pick: it’s how you get back in on a new phone.</span>
</div>
<div role="radiogroup" aria-label="pets" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{pets}}" as="p" hint-placeholder-count="20">
<button type="button" role="radio" aria-checked="{{p.checked}}" aria-label="{{p.aria}}" onClick="{{p.pick}}" class="ss-tile" style="box-sizing: border-box; width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: var(--panel); border-radius: var(--radius-panel); cursor: pointer; padding: 0; {{p.ring}}">
<x-import component-from-global-scope="Pawker.Pet" slug="{{p.slug}}" state="{{p.anim}}" size="{{s48}}" label="{{p.aria}}"></x-import>
</button>
</sc-for>
</div>
<span class="note-lg" style="color: var(--ink-2); text-align: center">others can pick the same pet. your pet name tells you apart.</span>
<sc-if value="{{picked}}" hint-placeholder-val="{{false}}">
<a href="{{nextHref}}" class="pk-btn pk-btn-primary" style="box-sizing: border-box; width: 100%; text-decoration: none">this is my pet</a>
</sc-if>
<sc-if value="{{notPicked}}" hint-placeholder-val="{{true}}">
<button type="button" class="pk-btn pk-btn-primary" disabled style="width: 100%">pick a pet first</button>
</sc-if>
</div>
<div aria-hidden="true" style="width: 100%; flex: none; margin-top: auto"><dc-import name="SceneGround" hint-size="100%,96px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"panel":{"editor":"enum","options":["auto","pine","frosted glass"],"default":"auto","section":"theme"},"flow":{"editor":"enum","options":["participant","host playing","host not playing"],"default":"participant"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const sel = (this.state && this.state.sel) || null;
const pets = ["kitten-ginger", "kitten-slate", "kitten-tuxedo", "kitten-calico", "dog-shiba", "dog-husky", "dog-basenji", "dog-pharaoh", "rabbit-caramel", "rabbit-grey", "rabbit-cinnamon", "rabbit-white", "guineapig-ginger", "guineapig-tan", "guineapig-tri", "guineapig-agouti", "ferret-white", "ferret-champagne", "ferret-silver", "ferret-chocolate"].map((slug, i) => ({
  slug, aria: "pet " + (i + 1), checked: sel === slug ? "true" : "false",
  anim: sel === slug ? "bob" : "still",
  ring: sel === slug ? "border: 3px solid var(--action); box-shadow: var(--shadow-mark);" : "border: 2px solid var(--border-soft); box-shadow: var(--shadow-panel);",
  pick: () => this.setState({ sel: slug })
}));
const flow = this.props.flow ?? "participant";
const host = flow !== "participant";
const next = flow === "participant" ? "MeetPet.dc.html" : flow === "host not playing" ? "ManageNew.dc.html" : "HostMeetPet.dc.html";
const panelPick = this.props.panel ?? "auto";
const panel = panelPick === "pine" ? "pine" : panelPick === "frosted glass" ? "glass" : "glass";
return { panel,  backHref: host ? "CreateGroup.dc.html" : "EnterPin.dc.html", nextHref: next, pets, picked: !!sel, notPicked: !sel, s48: 48 };
}
}
</script>
</body>
</html>
