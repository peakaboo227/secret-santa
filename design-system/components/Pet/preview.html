<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<div id="cast" class="pk-row pk-page" style="gap:10px 18px"></div><div id="states" class="pk-row"></div>
<script>
  var P = window.Pawker, h = React.createElement;

  ReactDOM.createRoot(document.getElementById('cast')).render(h(React.Fragment, null,
    P.Pet.slugs.map(function (s, i) { return h(P.Pet, { key: s, slug: s, size: 52, state: ['idle','sniff','doze'][i % 3], delay: (i % 5) * 0.4 }); })));
  ReactDOM.createRoot(document.getElementById('states')).render(h(React.Fragment, null,
    ['idle','sniff','doze','zoomies','still'].map(function (st) {
      return h('div', { key: st, className: 'pk-col', style: { alignItems: 'center', padding: 0 } }, h(P.Pet, { slug: 'kitten-calico', state: st, size: 64 }), h('span', { className: 'pk-cap' }, st));
    })));
</script>
</body>
</html>
